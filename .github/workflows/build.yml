name: Build Haunted House MOD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build MOD
        run: gradle build --no-daemon
      - name: Upload MOD JAR
        uses: actions/upload-artifact@v4
        with:
          name: Haunted-House-MOD
          path: build/libs/*.jar
